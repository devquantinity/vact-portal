services:
  db:
    image: postgres:16-alpine
    container_name: vact-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vact
      POSTGRES_PASSWORD: vact
      POSTGRES_DB: vact_portal
    ports:
      - "5432:5432"
    volumes:
      - vact_portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vact -d vact_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vact_portal_pgdata:
